name: health_app
description: "Health Surveillance System - Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # HTTP & API
  dio: ^5.7.0
  
  # State Management
  provider: ^6.1.2
  
  # Secure Storage
  flutter_secure_storage: ^9.2.4
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  
  # Charts
  fl_chart: ^0.70.2
  
  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  
  # Utils
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  flutter_dotenv: ^5.2.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
